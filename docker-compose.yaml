version: '3.8'

services:
  mlflow-server:
    image: python:3.10-slim
    container_name: fraud_mlflow_server
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow && mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./:/mlflow

  fraud-api:
    build: .
    container_name: fraud_serving_api
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      - mlflow-server
